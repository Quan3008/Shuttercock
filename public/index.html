<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#08090F" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="ShuttleTrack" />
  <title>ShuttleTrack — Quản Lý Chi Phí Cầu Lông</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.5.0/Recharts.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; }
    body {
      background: #08090F;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      color: #F2F4F8;
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
    }
    input, button { font-family: inherit; }
    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; }
    input[type="number"] { -moz-appearance: textfield; }
    input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.5); cursor: pointer; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }

    @keyframes fadeUp   { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:translateY(0); } }
    @keyframes fadeIn   { from { opacity:0; } to { opacity:1; } }
    @keyframes scaleIn  { from { opacity:0; transform:scale(0.93); } to { opacity:1; transform:scale(1); } }
    @keyframes spin     { to { transform:rotate(360deg); } }
    @keyframes float    { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-8px); } }
    @keyframes blob1    { 0%,100% { transform:translate(0,0) scale(1); } 50% { transform:translate(18px,-14px) scale(1.05); } }
    @keyframes blob2    { 0%,100% { transform:translate(0,0) scale(1); } 50% { transform:translate(-18px,12px) scale(1.04); } }
    @keyframes pulse    { 0%,100% { opacity:1; } 50% { opacity:0.4; } }
    @keyframes slideUp  { from { transform:translateY(100%); opacity:0; } to { transform:translateY(0); opacity:1; } }

    .fu   { animation: fadeUp  0.38s cubic-bezier(0.22,1,0.36,1) both; }
    .fi   { animation: fadeIn  0.25s ease both; }
    .si   { animation: scaleIn 0.28s cubic-bezier(0.34,1.56,0.64,1) both; }
    .s1   { animation-delay: 0.05s; }
    .s2   { animation-delay: 0.10s; }
    .s3   { animation-delay: 0.15s; }
    .s4   { animation-delay: 0.20s; }

    .btn-press  { transition: transform 0.12s cubic-bezier(0.34,1.56,0.64,1); }
    .btn-press:active { transform: scale(0.95) !important; }
    .card-press { transition: transform 0.18s ease; cursor: pointer; }
    .card-press:active { transform: scale(0.985); }
    .tog-anim   { transition: background 0.18s, border-color 0.18s, color 0.18s; }
    .inp-focus:focus {
      border-color: #7B61FF !important;
      box-shadow: 0 0 0 3px rgba(123,97,255,0.22) !important;
      outline: none;
    }
  </style>
</head>
<body>
<div id="root">
  <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:20px;background:#08090F;">
    <div style="width:72px;height:72px;border-radius:20px;background:linear-gradient(135deg,#7B61FF,#00D4FF);display:flex;align-items:center;justify-content:center;font-size:34px;">🏸</div>
    <div style="width:32px;height:32px;border:3px solid rgba(123,97,255,0.3);border-top-color:#7B61FF;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
  </div>
</div>

<script>
'use strict';

if (typeof React === 'undefined' || typeof ReactDOM === 'undefined') {
  document.getElementById('root').innerHTML =
    '<div style="color:#FF4E6A;padding:30px;font-family:sans-serif;text-align:center;">' +
    '<h2>⚠️ Lỗi Tải</h2><p>Không thể tải React CDN. Vui lòng kiểm tra kết nối internet.</p></div>';
  throw new Error('React not loaded');
}

var h        = React.createElement;
var useState = React.useState;
var useEffect= React.useEffect;
var RC = (typeof Recharts !== 'undefined') ? Recharts : null;

/* ── Theme ─────────────────────────────────────────────────── */
var T = {
  bg:'#08090F', surf:'rgba(255,255,255,0.045)', border:'rgba(255,255,255,0.08)',
  p1:'#7B61FF', p2:'#00D4FF', green:'#00E5A0', red:'#FF4E6A',
  amber:'#FFB547', pink:'#FF6B9D', text:'#F2F4F8',
  muted:'rgba(242,244,248,0.42)', dim:'rgba(242,244,248,0.18)'
};
var GRAD  = 'linear-gradient(135deg,'+T.p1+' 0%,'+T.p2+' 100%)';
var GRADS = 'linear-gradient(135deg,rgba(123,97,255,0.15) 0%,rgba(0,212,255,0.12) 100%)';
var GLOW  = '0 8px 36px rgba(123,97,255,0.42)';
var AVC   = [T.p1,T.p2,T.green,T.amber,T.pink,'#FF8C42','#6BCB77'];

/* ── Local storage cache ───────────────────────────────────── */
var LS = {
  get: function(k) { try { var v=localStorage.getItem(k); return v?JSON.parse(v):null; } catch(e){ return null; } },
  set: function(k,v){ try { localStorage.setItem(k,JSON.stringify(v)); } catch(e){} },
  del: function(k)  { try { localStorage.removeItem(k); } catch(e){} }
};

/* ── API client ────────────────────────────────────────────── */
var api = {
  get: async function(url) {
    var r = await fetch(url); if (!r.ok) throw new Error(r.status); return r.json();
  },
  post: async function(url, body) {
    var r = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
    if (!r.ok) throw new Error(r.status); return r.json();
  },
  del: async function(url) {
    var r = await fetch(url, { method:'DELETE' }); if (!r.ok) throw new Error(r.status); return r.json();
  }
};

/* ── DB: localStorage cache + server sync ──────────────────── */
var DB = {
  /* current session user */
  getUser:   function()  { return LS.get('st_me'); },
  setUser:   function(u) { LS.set('st_me', u); },
  clearUser: function()  { LS.del('st_me'); },

  /* users */
  getUsers: function() { return LS.get('st_users') || []; },
  _cacheUser: function(u) {
    var l = DB.getUsers();
    var i = l.findIndex(function(x){ return x.phone === u.phone; });
    if (i>=0) l[i]=u; else l.push(u);
    LS.set('st_users', l);
  },

  saveUser: function(u) {
    DB._cacheUser(u);
    api.post('/api/users', u).catch(function(e){ console.warn('saveUser server error:', e); });
  },

  findUserByPhone: async function(phone) {
    var local = DB.getUsers().find(function(u){ return u.phone === phone; });
    if (local) return local;
    try {
      var u = await api.post('/api/users/find', { phone: phone });
      if (u) DB._cacheUser(u);
      return u;
    } catch(e) { console.warn('findUser error:', e); return null; }
  },

  /* sessions */
  getSessions: function(ph) { return LS.get('st_sess_'+ph) || []; },

  saveSession: function(ph, s) {
    var l = DB.getSessions(ph);
    var i = l.findIndex(function(x){ return x.id === s.id; });
    if (i>=0) l[i]=s; else l.push(s);
    LS.set('st_sess_'+ph, l);
    api.post('/api/sessions', Object.assign({}, s, { userPhone: ph }))
      .catch(function(e){ console.warn('saveSession server error:', e); });
    return l;
  },

  delSession: function(ph, id) {
    var l = DB.getSessions(ph).filter(function(s){ return s.id !== id; });
    LS.set('st_sess_'+ph, l);
    api.del('/api/sessions/'+encodeURIComponent(id))
      .catch(function(e){ console.warn('delSession server error:', e); });
    return l;
  },

  loadSessionsFromServer: async function(ph) {
    try {
      var sessions = await api.get('/api/sessions/'+encodeURIComponent(ph));
      if (Array.isArray(sessions) && sessions.length > 0) {
        LS.set('st_sess_'+ph, sessions);
        return sessions;
      }
      return null;
    } catch(e) { console.warn('loadSessions server error:', e); return null; }
  },

  /* teams */
  getTeams: function(ph) { return LS.get('st_teams_'+ph) || []; },

  saveTeam: function(ph, t) {
    var l = DB.getTeams(ph);
    var i = l.findIndex(function(x){ return x.id === t.id; });
    if (i>=0) l[i]=t; else l.push(t);
    LS.set('st_teams_'+ph, l);
    api.post('/api/teams', Object.assign({}, t, { userPhone: ph }))
      .catch(function(e){ console.warn('saveTeam server error:', e); });
    return l;
  },

  delTeam: function(ph, id) {
    var l = DB.getTeams(ph).filter(function(t){ return t.id !== id; });
    LS.set('st_teams_'+ph, l);
    api.del('/api/teams/'+encodeURIComponent(id))
      .catch(function(e){ console.warn('delTeam server error:', e); });
    return l;
  },

  loadTeamsFromServer: async function(ph) {
    try {
      var teams = await api.get('/api/teams/'+encodeURIComponent(ph));
      if (Array.isArray(teams) && teams.length > 0) {
        LS.set('st_teams_'+ph, teams);
        return teams;
      }
      return null;
    } catch(e) { console.warn('loadTeams server error:', e); return null; }
  },

  /* members */
  getMembers: function(ph) { return LS.get('st_members_'+ph) || []; },

  saveMember: function(ph, m) {
    var l = DB.getMembers(ph);
    var i = l.findIndex(function(x){ return x.id === m.id; });
    if (i>=0) l[i]=m; else l.push(m);
    LS.set('st_members_'+ph, l);
    api.post('/api/members', Object.assign({}, m, { createdByUserPhone: ph }))
      .catch(function(e){ console.warn('saveMember server error:', e); });
    return l;
  },

  delMember: function(ph, id) {
    var l = DB.getMembers(ph).filter(function(m){ return m.id !== id; });
    LS.set('st_members_'+ph, l);
    api.del('/api/members/'+encodeURIComponent(id))
      .catch(function(e){ console.warn('delMember server error:', e); });
    return l;
  },

  loadMembersFromServer: async function(ph) {
    try {
      var members = await api.get('/api/members/'+encodeURIComponent(ph));
      if (Array.isArray(members)) {
        LS.set('st_members_'+ph, members);
        return members;
      }
      return null;
    } catch(e) { console.warn('loadMembers server error:', e); return null; }
  }
};

/* ── Utils ─────────────────────────────────────────────────── */
function uid()   { return Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7); }
function fmt(n)  { if (n==null) return '—'; return new Intl.NumberFormat('vi-VN').format(Math.round(n||0))+' ₫'; }
function fmtK(n) { if (!n&&n!==0) return '0 ₫'; var v=Math.round(n); if(v>=1e6) return (v/1e6).toFixed(1)+'M ₫'; if(v>=1000) return Math.round(v/1000)+'K ₫'; return v+' ₫'; }
function fmtD(d) { try { return new Date(d+'T00:00:00').toLocaleDateString('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric'}); } catch(e){ return d||'—'; } }
function fmtM(d) { return new Date(d).toLocaleDateString('vi-VN',{month:'long',year:'numeric'}); }
function mKey(d) { return new Date(d).toISOString().slice(0,7); }
function greet() { var hh=new Date().getHours(); return hh<12?'Chào buổi sáng':hh<18?'Chào buổi chiều':'Chào buổi tối'; }
function avCol(n){ return AVC[(n||'?').charCodeAt(0)%AVC.length]; }
function setKey(obj,key,val){ var out=Object.assign({},obj); out[key]=val; return out; }

function calcSess(s) {
  var pl=s.players||[];
  var played=pl.filter(function(p){ return p.played; });
  var ate=pl.filter(function(p){ return p.ate; });
  var shuttle=(parseFloat(s.shuttleQty)||0)*(parseFloat(s.shuttlePrice)||0);
  var sport=shuttle+(parseFloat(s.courtFee)||0);
  var food=parseFloat(s.foodCost)||0;
  var total=sport+food;
  var ss=played.length?sport/played.length:0;
  var fs=ate.length?food/ate.length:0;
  var res=pl.map(function(p){
    var sc=p.played?ss:0; var fc=p.ate?fs:0;
    return { name:p.name, played:p.played, ate:p.ate, sportCost:sc, foodCost:fc, cost:sc+fc };
  });
  return Object.assign({},s,{ players:res, totalCost:total, sportTotal:sport, foodTotal:food });
}

function sv(size,color){ return { width:size||20, height:size||20, viewBox:'0 0 24 24', fill:'none', stroke:color||'currentColor', strokeWidth:2, strokeLinecap:'round', strokeLinejoin:'round' }; }

/* ── Base components ───────────────────────────────────────── */
function Btn(props) {
  var variants = {
    grad:    { background:GRAD,    color:'white', boxShadow:GLOW },
    ghost:   { background:T.surf,  color:T.text,  border:'1px solid '+T.border },
    danger:  { background:'rgba(255,78,106,0.12)', color:T.red, border:'1px solid rgba(255,78,106,0.28)' },
    outline: { background:'transparent', color:T.p1, border:'1.5px solid '+T.p1 }
  };
  var v=props.variant||'grad'; var sm=!!props.sm; var full=!!props.full; var disabled=!!props.disabled;
  var base={ display:'inline-flex', alignItems:'center', justifyContent:'center', gap:7, border:'none', cursor:disabled?'not-allowed':'pointer', fontFamily:'inherit', fontWeight:800, fontSize:sm?13:15, borderRadius:sm?10:14, padding:sm?'9px 16px':'14px 22px', width:full?'100%':'auto', opacity:disabled?0.45:1, transition:'all 0.15s' };
  return h('button',{ onClick:props.onClick, disabled:disabled, className:'btn-press', style:Object.assign({},base,variants[v]||variants.grad,props.style||{}) }, props.children);
}

function Inp(props) {
  var fs=useState(false); var focus=fs[0]; var setFocus=fs[1];
  return h('div',{ style:{ marginBottom:14 } },
    props.label && h('div',{ style:{ color:T.muted, fontSize:11, fontWeight:700, letterSpacing:'0.07em', textTransform:'uppercase', marginBottom:7 } }, props.label),
    h('input',{
      type:props.type||'text', value:props.value, placeholder:props.placeholder, readOnly:!!props.readOnly,
      onChange:function(e){ if(props.onChange) props.onChange(e.target.value); },
      onFocus:function(){ setFocus(true); }, onBlur:function(){ setFocus(false); },
      className:'inp-focus',
      style:{ width:'100%', background:T.surf, borderRadius:12, color:T.text, fontSize:15, padding:'13px 14px', outline:'none', border:'1.5px solid '+(focus?T.p1:T.border), transition:'border-color 0.2s, box-shadow 0.2s', WebkitAppearance:'none', opacity:props.readOnly?0.6:1 }
    }),
    props.note && h('div',{ style:{ color:T.muted, fontSize:11, marginTop:5 } }, props.note)
  );
}

function Card(props) {
  return h('div',{
    onClick:props.onClick, className:(props.onClick?'card-press ':'')+( props.className||''),
    style:Object.assign({ background:T.surf, border:'1px solid '+T.border, borderRadius:18, backdropFilter:'blur(16px)', WebkitBackdropFilter:'blur(16px)', overflow:'hidden', cursor:props.onClick?'pointer':'default' }, props.style||{})
  }, props.children);
}

function Avatar(props) {
  var name=props.name; var size=props.size||36; var c=avCol(name);
  var init=(name||'?').split(' ').map(function(w){ return w[0]; }).slice(0,2).join('').toUpperCase();
  return h('div',{ style:{ width:size, height:size, borderRadius:'50%', background:c+'1E', border:'2px solid '+c+'44', display:'flex', alignItems:'center', justifyContent:'center', fontSize:size*0.38, fontWeight:900, color:c, flexShrink:0 } }, init);
}

function Toggle(props) {
  return h('button',{
    onClick:props.onToggle, className:'tog-anim btn-press',
    style:{ display:'inline-flex', alignItems:'center', gap:5, padding:'6px 11px', borderRadius:20, border:'1.5px solid '+(props.active?T.p1:T.border), background:props.active?GRADS:'transparent', color:props.active?T.text:T.muted, fontSize:12, fontWeight:700, cursor:'pointer', fontFamily:'inherit', whiteSpace:'nowrap' }
  }, props.icon, props.label);
}

function Divider(props){ return h('div',{ style:Object.assign({ height:1, background:T.border }, props&&props.style) }); }

function Badge(props){ var color=props.color||T.p1; return h('span',{ style:{ padding:'3px 10px', borderRadius:20, background:color+'1E', color:color, fontSize:11, fontWeight:700 } }, props.children); }

function Spinner(){ return h('div',{ style:{ width:18, height:18, flexShrink:0, border:'2.5px solid rgba(255,255,255,0.25)', borderTopColor:'white', borderRadius:'50%', animation:'spin 0.7s linear infinite' } }); }

function HeroCard(props) {
  return h('div',{
    style:Object.assign({ background:GRAD, borderRadius:22, padding:'24px 22px', position:'relative', overflow:'hidden', boxShadow:'0 16px 60px rgba(123,97,255,0.45)', textAlign:props.center?'center':'left' }, props.style||{})
  },
    h('div',{ style:{ position:'absolute', top:-40, right:-40, width:150, height:150, borderRadius:'50%', background:'rgba(255,255,255,0.08)', pointerEvents:'none' } }),
    h('div',{ style:{ position:'absolute', bottom:-50, left:10, width:100, height:100, borderRadius:'50%', background:'rgba(255,255,255,0.05)', pointerEvents:'none' } }),
    h('p',{ style:{ color:'rgba(255,255,255,0.68)', fontSize:11, fontWeight:700, letterSpacing:'0.08em', textTransform:'uppercase', margin:'0 0 9px' } }, props.label),
    h('div',{ style:{ color:'white', fontSize:38, fontWeight:900, letterSpacing:'-1.5px', lineHeight:1 } }, props.amount),
    props.sub && h('p',{ style:{ color:'rgba(255,255,255,0.65)', fontSize:13, margin:'10px 0 0', fontWeight:500 } }, props.sub)
  );
}

function MiniStat(props) {
  return h('div',{ style:{ background:T.surf, border:'1px solid '+T.border, borderRadius:14, padding:'14px 12px', flex:1, minWidth:0, overflow:'hidden' } },
    props.icon && h('div',{ style:{ fontSize:18, marginBottom:6 } }, props.icon),
    h('div',{ style:{ color:props.color||T.p1, fontSize:16, fontWeight:900, marginBottom:3, letterSpacing:'-0.5px', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' } }, props.value),
    h('div',{ style:{ color:T.muted, fontSize:11, fontWeight:600 } }, props.label)
  );
}

function PageHeader(props) {
  return h('div',{ style:{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:22, paddingTop:2 } },
    h('div',{ style:{ display:'flex', alignItems:'center', gap:12 } },
      props.onBack && h('button',{ onClick:props.onBack, className:'btn-press', style:{ background:T.surf, border:'1px solid '+T.border, borderRadius:10, width:40, height:40, display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer', flexShrink:0 } },
        h('svg',sv(18,T.text),h('polyline',{ points:'15 18 9 12 15 6' }))
      ),
      h('h2',{ style:{ color:T.text, fontSize:19, fontWeight:900, letterSpacing:'-0.4px' } }, props.title)
    ),
    props.action||null
  );
}

/* ── Server status dot ─────────────────────────────────────── */
function ServerDot(props) {
  var online = props.online;
  return h('div', {
    title: online ? 'Máy chủ: kết nối' : 'Máy chủ: mất kết nối',
    style: {
      width: 8, height: 8, borderRadius: '50%',
      background: online ? T.green : T.amber,
      animation: online ? 'none' : 'pulse 2s ease-in-out infinite',
      flexShrink: 0
    }
  });
}

function NavBar(props) {
  var active=props.active; var onNav=props.onNav; var onFab=props.onFab;
  function makeTab(id,label,iconNodes){
    var ac=active===id; var col=ac?T.p1:T.muted;
    return h('button',{ key:id, onClick:function(){ onNav(id); }, style:{ flex:1, display:'flex', flexDirection:'column', alignItems:'center', gap:3, background:'none', border:'none', cursor:'pointer', padding:'10px 0', color:col, transition:'color 0.2s', fontFamily:'inherit' } },
      iconNodes(col), h('span',{ style:{ fontSize:10, fontWeight:700 } }, label));
  }
  return h('nav',{
    style:{ position:'fixed', bottom:0, left:0, right:0, zIndex:200, background:'rgba(8,9,15,0.95)', backdropFilter:'blur(24px)', WebkitBackdropFilter:'blur(24px)', borderTop:'1px solid '+T.border, display:'flex', alignItems:'center', paddingBottom:'8px' }
  },
    makeTab('home','Trang chủ',function(c){ return h('svg',sv(20,c),h('path',{d:'M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z'}),h('polyline',{points:'9 22 9 12 15 12 15 22'})); }),
    makeTab('history','Lịch sử',function(c){ return h('svg',sv(20,c),h('circle',{cx:12,cy:12,r:10}),h('polyline',{points:'12 6 12 12 16 14'})); }),
    h('div',{ style:{ flex:'0 0 72px', display:'flex', justifyContent:'center', paddingBottom:10 } },
      h('button',{ onClick:onFab, className:'btn-press', style:{ width:56, height:56, borderRadius:'50%', background:GRAD, border:'none', cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center', boxShadow:'0 6px 32px rgba(123,97,255,0.6)', position:'relative', top:-12 } },
        h('svg',sv(22,'white'),h('line',{x1:12,y1:5,x2:12,y2:19}),h('line',{x1:5,y1:12,x2:19,y2:12}))
      )
    ),
    makeTab('summary','Tổng kết',function(c){ return h('svg',sv(20,c),h('line',{x1:18,y1:20,x2:18,y2:10}),h('line',{x1:12,y1:20,x2:12,y2:4}),h('line',{x1:6,y1:20,x2:6,y2:14})); }),
    makeTab('teams','Đội',function(c){ return h('svg',sv(20,c),h('path',{d:'M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2'}),h('circle',{cx:9,cy:7,r:4}),h('path',{d:'M23 21v-2a4 4 0 0 0-3-3.87'}),h('path',{d:'M16 3.13a4 4 0 0 1 0 7.75'})); })
  );

function MemberSelector(props) {
  // props: userPhone, allMembers (cache seed), selected (name[]),
  //        onConfirm(names), onClose, onAddMember(memberObj), onMembersRefresh(list)
  var sl=useState(props.selected||[]); var picked=sl[0]; var setPicked=sl[1];
  var sa=useState(false); var showAdd=sa[0]; var setShowAdd=sa[1];
  var sn=useState('');    var newName=sn[0]; var setNewName=sn[1];
  var ml=useState(props.allMembers||[]); var members=ml[0]; var setMembers=ml[1];
  var ll=useState((props.allMembers||[]).length===0); var loading=ll[0]; var setLoading=ll[1];

  /* on open: localStorage instantly → server in background */
  useEffect(function(){
    var ph=props.userPhone; if(!ph) return;
    var cached=LS.get('st_contacts_'+ph)||[];
    if(cached.length>0){ setMembers(cached); setLoading(false); }
    api.get('/api/contacts/'+encodeURIComponent(ph))
      .then(function(fetched){
        if(Array.isArray(fetched)){
          LS.set('st_contacts_'+ph, fetched);
          setMembers(fetched);
          if(props.onMembersRefresh) props.onMembersRefresh(fetched);
        }
        setLoading(false);
      })
      .catch(function(){ setLoading(false); });
  }, []);

  /* sort: most recently added first, then alphabetical */
  var list=members.slice().sort(function(a,b){
    var da=a.createdAt?new Date(a.createdAt):new Date(0);
    var db=b.createdAt?new Date(b.createdAt):new Date(0);
    if(da>db) return -1; if(da<db) return 1;
    return a.name.localeCompare(b.name,'vi');
  });

  function toggleMember(name){
    setPicked(function(prev){ return prev.indexOf(name)>=0?prev.filter(function(n){ return n!==name; }):prev.concat([name]); });
  }

  function commitAdd(){
    var nm=newName.trim(); if(!nm) return;
    var m={ id:uid(), name:nm, phoneNumber:'', createdByUserPhone:props.userPhone||'', createdAt:new Date().toISOString(), type:'manual' };
    setMembers(function(prev){ return prev.some(function(x){ return x.name===nm; })?prev:[m].concat(prev); });
    /* invalidate contacts cache so next open re-fetches */
    if(props.userPhone) LS.del('st_contacts_'+props.userPhone);
    props.onAddMember(m);
    setPicked(function(prev){ return prev.indexOf(nm)>=0?prev:prev.concat([nm]); });

        h('h3',{ style:{ color:T.text,fontSize:17,fontWeight:900,margin:0 } },'Chọn Thành Viên'),
        picked.length>0

          : loading
            ? h('div',{ style:{ width:16,height:16,border:'2.5px solid rgba(123,97,255,0.25)',borderTopColor:T.p1,borderRadius:'50%',animation:'spin 0.7s linear infinite' } })

      ),

      /* scrollable member list */
      h('div',{ style:{ flex:1,overflowY:'auto',padding:'10px 16px' } },

/* ═══════════════════════════════════════════
   CREATE SESSION
═══════════════════════════════════════════ */
function CreateSessionScreen(props) {
  var user=props.user; var teams=props.teams; var onSave=props.onSave; var onBack=props.onBack;
  var allMembers=props.allMembers||[]; var onAddMember=props.onAddMember;
  var draft=props.draft||{};
  /* forward server-refresh back to App so global state stays in sync */

  var d1=useState(draft.date||new Date().toISOString().slice(0,10)); var date=d1[0]; var setDate=d1[1];
  var d2=useState(draft.qty||'');    var qty=d2[0];    var setQty=d2[1];
  var d3=useState(draft.price||''); var price=d3[0]; var setPrice=d3[1];
  var d4=useState(draft.court||''); var court=d4[0]; var setCourt=d4[1];
  var d5=useState(draft.food||'');  var food=d5[0];  var setFood=d5[1];
  var d6=useState(draft.players||[{ id:uid(), name:user.name, played:true, ate:false }]); var players=d6[0]; var setPlayers=d6[1];
  var d8=useState(draft.teamId||''); var teamId=d8[0]; var setTeamId=d8[1];
  var ss=useState(false); var showSelector=ss[0]; var setShowSelector=ss[1];

  var sport=(parseFloat(qty)||0)*(parseFloat(price)||0)+(parseFloat(court)||0);
  var fTotal=parseFloat(food)||0;
  var grand=sport+fTotal;

  function loadTeam(tid) {
    setTeamId(tid); if(!tid) return;
    var team=teams.find(function(t){ return t.id===tid; }); if(!team) return;
    var existNames={};
    players.forEach(function(p){ existNames[p.name.toLowerCase()]=true; });
    var toAdd=team.members.filter(function(m){ return !existNames[m.toLowerCase()]; }).map(function(m){ return { id:uid(), name:m, played:true, ate:false }; });
    setPlayers(function(prev){ return prev.concat(toAdd); });
  }

  function toggle(id,field){ setPlayers(function(prev){ return prev.map(function(p){ return p.id!==id?p:setKey(p,field,!p[field]); }); }); }
  function removePlayer(id){ if(players.length<=1) return; setPlayers(function(prev){ return prev.filter(function(p){ return p.id!==id; }); }); }

  function onSelectorConfirm(pickedObjs) {
    setPlayers(function(prev){
      var prevMap={};
      prev.forEach(function(p){ prevMap[p.name]=p; });
      return pickedObjs.map(function(o){
        var name=o.name||o;
        return prevMap[name]||{ id:uid(), name:name, played:true, ate:false };
      });
    });
    setShowSelector(false);
  }

  function handleAddMember(m) {
    m.createdByUserPhone=user.phone;
    if(onAddMember) onAddMember(m);
  }

  var ve=useState(null);    var editingTeam=ve[0];    var setEditingTeam=ve[1];

  function doUpdate() {
    if (!tName.trim()||members.length===0) return; setLoading(true);
    onTeamsChange(DB.saveTeam(user.phone, buildPayload(editingTeam.id, editingTeam.createdAt)));
    resetForm(); setView('list'); setLoading(false);
  }

  function startEdit(t) {
    setTName(t.name);
    /* Convert string member names → objects; owner always first */
    var ownerObj={ name:user.name, phoneNumber:user.phone, type:'registered' };
    var rest=t.members
      .filter(function(m){ return m!==user.name; })
      .map(function(m){ return { name:m, phoneNumber:'', type:'manual' }; });
    setMembers([ownerObj].concat(rest));
    setEditingTeam(t);
    setView('edit');
  }

  function doDelete(tid){ onTeamsChange(DB.delTeam(user.phone,tid)); setDelConfirm(null); }

  function onSelectorConfirm(pickedObjs) {
    var ownerIncluded=pickedObjs.some(function(o){ return o.name===user.name; });
    var result=ownerIncluded?pickedObjs:[{ name:user.name, phoneNumber:user.phone, type:'registered' }].concat(pickedObjs);
    setMembers(result);
    setShowSelector(false);
  }

  function handleAddMember(m) {
    m.createdByUserPhone=user.phone;
    if(onAddMember) onAddMember(m);
  }

  function XIcon(){ return h('svg',sv(15,T.muted),h('line',{x1:18,y1:6,x2:6,y2:18}),h('line',{x1:6,y1:6,x2:18,y2:18})); }
  function TrashIcon(){ return h('svg',sv(16,T.red),h('polyline',{points:'3 6 5 6 21 6'}),h('path',{d:'M19 6l-1 14H6L5 6'}),h('path',{d:'M10 11v6'}),h('path',{d:'M14 11v6'}),h('path',{d:'M9 6V4h6v2'})); }
  function PlusIcon(){ return h('svg',sv(14,'white'),h('line',{x1:12,y1:5,x2:12,y2:19}),h('line',{x1:5,y1:12,x2:19,y2:12})); }
  function EditIcon(){ return h('svg',sv(15,T.accent),h('path',{d:'M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7'}),h('path',{d:'M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z'})); }

  /* ── Shared form (create / edit) ── */
  if (view==='create'||view==='edit') {
    var isEdit=view==='edit';
    return h('div',{ className:'fi', style:{ padding:'20px 16px 120px', maxWidth:480, margin:'0 auto' } },
      showSelector ? h(MemberSelector,{
        userPhone:user.phone,
        allMembers:allMembers,
        selected:members,
        onConfirm:onSelectorConfirm,
        onClose:function(){ setShowSelector(false); },
        onAddMember:handleAddMember,
        onMembersRefresh:props.onMembersRefresh
      }) : null,
      h(PageHeader,{ title:isEdit?'Chỉnh Sửa Đội':'Tạo Đội Mới', onBack:function(){ resetForm(); setView('list'); } }),
      h(Card,{ className:'fu', style:{ padding:20, marginBottom:14 } },
        h(Inp,{ label:'Tên Đội', value:tName, onChange:setTName, placeholder:'VD: Đội Thứ Hai' })
      ),
      h(Card,{ className:'fu s1', style:{ padding:20, marginBottom:14 } },
        h('div',{ style:{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:14 } },
          h('h3',{ style:{ color:T.text, fontSize:14, fontWeight:800, margin:0 } },'Thành Viên ('+members.length+')'),
          h(Btn,{ onClick:function(){ setShowSelector(true); }, sm:true, style:{ padding:'8px 14px' } },
            h('svg',sv(14,'white'),h('path',{d:'M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2'}),h('circle',{cx:9,cy:7,r:4}),h('path',{d:'M23 21v-2a4 4 0 0 0-3-3.87'}),h('path',{d:'M16 3.13a4 4 0 0 1 0 7.75'})),' Chọn'
          )
        ),
        members.map(function(m,i){
          var mName=typeof m==='string'?m:m.name;
          return h('div',{ key:i, style:{ display:'flex', alignItems:'center', gap:10, padding:'10px 13px', background:'rgba(255,255,255,0.03)', borderRadius:10, marginBottom:8, border:'1px solid '+T.border } },
            h(Avatar,{ name:mName, size:30 }),
            h('span',{ style:{ flex:1, color:T.text, fontSize:14, fontWeight:600 } }, mName, i===0?h('span',{ style:{ color:T.muted, fontSize:12, marginLeft:6 } },'(bạn)'):null),
            i>0 ? h('button',{ onClick:function(){ removeMember(i); }, style:{ background:'none', border:'none', cursor:'pointer', display:'flex', padding:4 } }, h(XIcon)) : null
          );
        }),
        h('button',{ onClick:function(){ setShowSelector(true); }, className:'btn-press',
          style:{ width:'100%', padding:'11px', marginTop:4, background:'transparent', border:'1.5px dashed '+T.border, borderRadius:10, color:T.muted, fontSize:13, fontWeight:700, cursor:'pointer', fontFamily:'inherit', display:'flex', alignItems:'center', justifyContent:'center', gap:7 } },
          h('svg',sv(14,T.muted),h('line',{x1:12,y1:5,x2:12,y2:19}),h('line',{x1:5,y1:12,x2:19,y2:12})),
          'Thêm / Chọn Thành Viên Từ Danh Bạ'
        )
      ),
      h('div',{ className:'fu s2' },
        h(Btn,{ onClick:isEdit?doUpdate:doCreate, disabled:loading||!tName.trim(), full:true, style:{ padding:'15px' } },
          loading?h(Spinner):null,
          loading?(isEdit?' Đang lưu…':' Đang tạo…'):(isEdit?'💾 Lưu Thay Đổi':'✅ Tạo Đội')
        )
      )
    );
  }

  /* ── Delete confirmation dialog ── */
  function DelDialog(){
    if(!delConfirm) return null;
    return h('div',{ style:{ position:'fixed', inset:0, zIndex:300, display:'flex', alignItems:'center', justifyContent:'center', padding:'0 24px', background:'rgba(0,0,0,0.55)' } },
      h(Card,{ style:{ padding:28, maxWidth:360, width:'100%', textAlign:'center' } },
        h('div',{ style:{ fontSize:40, marginBottom:12 } },'🗑️'),
        h('div',{ style:{ color:T.text, fontWeight:800, fontSize:17, marginBottom:8 } },'Xoá đội "'+delConfirm.name+'"?'),
        h('div',{ style:{ color:T.muted, fontSize:14, marginBottom:22, lineHeight:1.55 } },'Hành động này không thể hoàn tác. Đội sẽ bị xoá khỏi tất cả thành viên.'),
        h('div',{ style:{ display:'flex', gap:12 } },
          h(Btn,{ onClick:function(){ setDelConfirm(null); }, variant:'ghost', full:true },'Huỷ'),
          h(Btn,{ onClick:function(){ doDelete(delConfirm.id); }, variant:'danger', full:true },'Xoá')
        )
      )
    );
  }

  return h('div',{ className:'fi', style:{ padding:'20px 16px 120px', maxWidth:480, margin:'0 auto' } },
    h(DelDialog),
    h(PageHeader,{ title:'Đội Của Tôi', action:h(Btn,{ onClick:function(){ resetForm(); setView('create'); }, sm:true }, h(PlusIcon),' Tạo mới') }),
    teams.length===0
      ? h(Card,{ style:{ padding:'44px 20px', textAlign:'center' } },
          h('div',{ style:{ fontSize:52, marginBottom:14 } },'👥'),
          h('div',{ style:{ color:T.muted, fontSize:14, marginBottom:22, lineHeight:1.6 } },'Tạo đội để nhanh chóng tải danh sách người chơi thường xuyên!'),
          h(Btn,{ onClick:function(){ resetForm(); setView('create'); }, style:{ margin:'0 auto' } },'+ Tạo Đội')
        )
      : teams.map(function(t,gi){
          return h(Card,{ key:t.id, className:'fu', style:{ padding:18, marginBottom:12, animationDelay:gi*0.06+'s' } },
            h('div',{ style:{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', gap:12 } },
              h('div',{ style:{ flex:1 } },
                h('div',{ style:{ display:'flex', alignItems:'center', gap:8, marginBottom:12 } },
                  h('span',{ style:{ color:T.text, fontWeight:900, fontSize:17 } }, t.name),
                  !t.isOwner ? h('span',{ style:{ fontSize:10, fontWeight:800, color:'#f59e0b', background:'rgba(245,158,11,0.12)', border:'1px solid rgba(245,158,11,0.25)', padding:'2px 8px', borderRadius:20 } },'Thành Viên') : null
                ),
                h('div',{ style:{ display:'flex', flexWrap:'wrap', gap:7 } },
                  t.members.map(function(m,i){ return h('div',{ key:i, style:{ display:'flex', alignItems:'center', gap:5, background:GRADS, padding:'4px 10px', borderRadius:20, border:'1px solid rgba(123,97,255,0.2)' } }, h(Avatar,{ name:m, size:18 }), h('span',{ style:{ fontSize:12, color:T.text, fontWeight:700 } }, m)); })
                ),
                h('div',{ style:{ color:T.muted, fontSize:11, marginTop:10 } }, t.members.length+' thành viên')
              ),
              t.isOwner ? h('div',{ style:{ display:'flex', flexDirection:'column', gap:6 } },
                h('button',{ onClick:function(){ startEdit(t); }, className:'btn-press', title:'Chỉnh sửa', style:{ background:'rgba(123,97,255,0.1)', border:'1px solid rgba(123,97,255,0.2)', borderRadius:8, cursor:'pointer', padding:'6px 8px', display:'flex' } }, h(EditIcon)),
                h('button',{ onClick:function(){ setDelConfirm(t); }, className:'btn-press', title:'Xoá', style:{ background:'rgba(239,68,68,0.08)', border:'1px solid rgba(239,68,68,0.18)', borderRadius:8, cursor:'pointer', padding:'6px 8px', display:'flex' } }, h(TrashIcon))
              ) : null
            )
          );
        })
  );
}

/* ═══════════════════════════════════════════
   ROOT APP
═══════════════════════════════════════════ */
function App() {
  var s1=useState(null);   var user=s1[0];     var setUser=s1[1];
  var s2=useState([]);     var sessions=s2[0]; var setSessions=s2[1];
  var s3=useState([]);     var teams=s3[0];    var setTeams=s3[1];
  var s4=useState('boot'); var screen=s4[0];   var setScreen=s4[1];
  var s5=useState({});     var params=s5[0];   var setParams=s5[1];
  var s6=useState(null);   var pending=s6[0];  var setPending=s6[1];
  var s7=useState(null);   var draft=s7[0];    var setDraft=s7[1];
  var s8=useState(true);   var serverOnline=s8[0]; var setServerOnline=s8[1];
  var s9=useState([]);     var members=s9[0];  var setMembers=s9[1];

  /* poll server health every 30s */
  useEffect(function() {
    function ping() {
      fetch('/api/health').then(function(r){ setServerOnline(r.ok); }).catch(function(){ setServerOnline(false); });
    }
    ping();
    var iv = setInterval(ping, 30000);
    return function(){ clearInterval(iv); };
  }, []);

  useEffect(function() {
    var u=DB.getUser();
    if (u) {
      setUser(u);
      setSessions(DB.getSessions(u.phone));
      setTeams(DB.getTeams(u.phone));
      setMembers(DB.getMembers(u.phone));
      setScreen('home');
      DB.loadSessionsFromServer(u.phone).then(function(ss){ if(ss) setSessions(ss); });
      DB.loadTeamsFromServer(u.phone).then(function(ts){ if(ts) setTeams(ts); });
      DB.loadMembersFromServer(u.phone).then(function(ms){ if(ms) setMembers(ms); });
    } else {
      setScreen('login');
    }
  }, []);

  function login(u) {
    setUser(u); setSessions(DB.getSessions(u.phone)); setTeams(DB.getTeams(u.phone)); setMembers(DB.getMembers(u.phone)); setScreen('home');
    DB.loadSessionsFromServer(u.phone).then(function(ss){ if(ss) setSessions(ss); });
    DB.loadTeamsFromServer(u.phone).then(function(ts){ if(ts) setTeams(ts); });
    DB.loadMembersFromServer(u.phone).then(function(ms){ if(ms) setMembers(ms); });
  }
  function logout() { DB.clearUser(); setUser(null); setSessions([]); setTeams([]); setMembers([]); setScreen('login'); }
  function nav(s,p) { setScreen(s); setParams(p||{}); }
  function onCalc(calc,raw) { setDraft(raw); setPending(calc); setScreen('result'); }
  function onSave() { var upd=DB.saveSession(user.phone,pending); setSessions(upd); setPending(null); setDraft(null); setScreen('home'); }
  function onDel()  { var upd=DB.delSession(user.phone,params.session.id); setSessions(upd); setScreen('history'); }
  function addMember(m) { setMembers(DB.saveMember(user.phone, m)); }

  if (screen==='boot') {
    return h('div',{ style:{ background:T.bg, minHeight:'100vh', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:22 } },
      h('div',{ style:{ width:72, height:72, borderRadius:22, background:GRAD, display:'flex', alignItems:'center', justifyContent:'center', fontSize:34, boxShadow:GLOW, animation:'float 3s ease-in-out infinite' } },'🏸'),
      h('div',{ style:{ width:34, height:34, border:'3px solid rgba(123,97,255,0.25)', borderTopColor:T.p1, borderRadius:'50%', animation:'spin 0.8s linear infinite' } })
    );
  }

  if (screen==='login') return h(LoginScreen,{ onLogin:login });

  var mainTabs=['home','history','summary','teams'];
  var showNav=mainTabs.indexOf(screen)>=0;
  var content=null;
  if      (screen==='home')    content=h(HomeScreen,         { user:user, sessions:sessions, onNav:nav });
  else if (screen==='history') content=h(HistoryScreen,      { sessions:sessions, onNav:nav });
  else if (screen==='summary') content=h(SummaryScreen,      { sessions:sessions });
  else if (screen==='teams')   content=h(TeamsScreen,        { user:user, teams:teams, onTeamsChange:setTeams, allMembers:members, onAddMember:addMember, onMembersRefresh:setMembers });
  else if (screen==='create')  content=h(CreateSessionScreen,{ user:user, teams:teams, onSave:onCalc, onBack:function(){ setDraft(null); setScreen('home'); }, draft:draft, allMembers:members, onAddMember:addMember, onMembersRefresh:setMembers });
  else if (screen==='result'&&pending) content=h(ResultScreen,{ session:pending, onConfirm:onSave, onBack:function(){ setScreen('create'); } });
  else if (screen==='detail'&&params.session) content=h(DetailScreen,{ session:params.session, onBack:function(){ setScreen('history'); }, onDelete:onDel });

  return h('div',{ style:{ background:T.bg, minHeight:'100vh', fontFamily:"'Plus Jakarta Sans',system-ui,sans-serif", color:T.text } },
    showNav ? h(TopBar,{ user:user, onLogout:logout, serverOnline:serverOnline }) : null,
    content,
    showNav ? h(NavBar,{ active:screen, onNav:nav, onFab:function(){ nav('create'); } }) : null
  );
}

/* ── Mount ─────────────────────────────────────────────────── */
function mountApp() {
  try {
    ReactDOM.createRoot(document.getElementById('root')).render(h(App, null));
  } catch(e) {
    document.getElementById('root').innerHTML =
      '<div style="color:#FF4E6A;padding:30px;font-family:sans-serif;background:#08090F;min-height:100vh;">' +
      '<h2 style="margin-bottom:12px">⚠️ Lỗi Khởi Động</h2>' +
      '<pre style="background:rgba(255,255,255,0.05);padding:16px;border-radius:8px;font-size:13px;white-space:pre-wrap;">'+e.message+'</pre>' +
      '</div>';
  }
}

if (document.readyState==='complete'||document.readyState==='interactive') { mountApp(); }
else { window.addEventListener('DOMContentLoaded', mountApp); }
</script>
</body>
</html>
